<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="main-container">
        <div class="header"><span>Rock Paper Scissors Game</span></div>
        <!-- <p>Press F12 to open the DevTools of your browser and click in the "Console" tab to see your score and results.</p> -->

        <div class="title">Click on the buttons to choice, the one who gets 5 points wins!</div>
        
        <div class="choice-container">
            <div class="btn-choice">
                <div id="rock" class="btn-container">
                    <div>Rock</div>
                    <img src="img/rock.png">
                </div>
                <div id="paper" class="btn-container">
                    <div>Paper</div>
                    <img src="img/paper.png">
                </div>
                <div id="scissors" class="btn-container">
                    <div>Scissors</div>
                    <img src="img/scissors.png">
                </div>
            </div>
        </div>
    
        <div class="results-container">
            <div class="results-text-container">
                <div class="results-text">Results:</div>
                <div class="round-text">
                    <div class="results-text round-winner"></div>
                    <div class="results-text round-results"></div>               
                </div>

                <div class="player-computer-choice-container">
                    <div class="results-text player-choice-container"></div>
                    <div class="results-text computer-choice-container"></div>
                </div>

                <div class="results-text game-winner"></div> 
            </div>
        </div>

        <footer>Made by robothello444</footer>
    </div>
    
</body>

</html>
